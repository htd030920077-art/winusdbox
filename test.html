<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Management Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white font-sans">
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-gray-800 p-8 rounded-xl shadow-xl w-full max-w-md border border-gray-700">
            <h2 class="text-2xl font-bold mb-6 text-center text-emerald-400">Đăng Nhập Quản Trị</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Tài khoản</label>
                    <input type="text" id="username" class="w-full px-4 py-2 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-emerald-500" value="admin">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Mật khẩu</label>
                    <input type="password" id="password" class="w-full px-4 py-2 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-emerald-500" value="admin123">
                </div>
                <button onclick="login()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded transition">Đăng Nhập</button>
            </div>
        </div>
    </div>
    <div id="admin-panel" class="hidden min-h-screen p-6">
        <h1 class="text-3xl font-bold text-emerald-400 mb-4">Trang Quản Trị Hệ Thống</h1>
        <p class="text-gray-300">Đăng nhập thành công! Hệ thống quản lý nạp rút và số dư đang hoạt động.</p>
    </div>
    <script>
        function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if(u === 'admin' && p === 'admin123') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
            } else {
                alert('Sai tài khoản hoặc mật khẩu!');
            }
        }
    </script>
</body>
</html>
