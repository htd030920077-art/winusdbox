<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIN USDBOX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-main: #0b0f19; --neon-green: #c0f135; }
        body { background-color: var(--bg-main); color: #ffffff; font-family: sans-serif; user-select: none; }
        .card-dark { background: rgba(18, 26, 43, 0.9); border: 1px solid rgba(192, 241, 53, 0.2); }
        .neon-btn { background-color: var(--neon-green); color: #000; }
        .neon-text { color: var(--neon-green); }
    </style>
</head>
<body class="flex justify-center min-h-screen">
    <div class="w-full max-w-md bg-[#0b0f19] flex flex-col justify-between min-h-screen relative p-4 pb-20 shadow-2xl">
        
        <!-- MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ -->
        <div id="auth-screen" class="fixed inset-0 bg-[#0b0f19] z-[100] flex items-center justify-center p-6">
            <div class="w-full max-w-sm space-y-4">
                <div class="text-center space-y-2">
                    <div class="w-14 h-14 bg-[#c0f135] rounded-2xl mx-auto flex items-center justify-center text-gray-950 text-2xl font-black">
                        <i class="fa-solid fa-cube"></i>
                    </div>
                    <h1 class="text-xl font-black text-white">WIN USDBOX</h1>
                </div>

                <div id="login-form" class="space-y-3">
                    <input type="text" id="login-username" placeholder="Số điện thoại / Email" class="w-full bg-[#121929] border border-gray-800 rounded-xl p-3 text-xs text-white">
                    <input type="password" id="login-password" placeholder="Mật khẩu" class="w-full bg-[#121929] border border-gray-800 rounded-xl p-3 text-xs text-white">
                    <button onclick="handleLogin()" class="w-full neon-btn font-bold py-3 rounded-xl text-xs">ĐĂNG NHẬP</button>
                    <p class="text-center text-xs text-gray-400">Chưa có tài khoản? <span onclick="switchAuthMode('register')" class="neon-text font-bold cursor-pointer">Đăng ký</span></p>
                </div>

                <div id="register-form" class="space-y-3 hidden">
                    <input type="text" id="reg-fullname" placeholder="Họ và tên" class="w-full bg-[#121929] border border-gray-800 rounded-xl p-3 text-xs text-white">
                    <input type="text" id="reg-username" placeholder="Số điện thoại / Email" class="w-full bg-[#121929] border border-gray-800 rounded-xl p-3 text-xs text-white">
                    <input type="password" id="reg-password" placeholder="Mật khẩu" class="w-full bg-[#121929] border border-gray-800 rounded-xl p-3 text-xs text-white">
                    <input type="text" id="reg-refcode" placeholder="Mã người giới thiệu (Tùy chọn)" class="w-full bg-[#121929] border border-gray-800 rounded-xl p-3 text-xs text-white">
                    <button onclick="handleRegister()" class="w-full neon-btn font-bold py-3 rounded-xl text-xs">ĐĂNG KÝ TÀI KHOẢN</button>
                    <p class="text-center text-xs text-gray-400">Đã có tài khoản? <span onclick="switchAuthMode('login')" class="neon-text font-bold cursor-pointer">Đăng nhập</span></p>
                </div>
            </div>
        </div>

        <!-- GIAO DIỆN CHÍNH -->
        <div class="space-y-4">
            <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                <span class="font-bold text-sm">WINUSDBOX</span>
                <span class="text-xs neon-text font-bold" id="user-display"></span>
            </div>

            <div class="card-dark rounded-2xl p-5 text-center space-y-3">
                <p class="text-xs text-gray-400">Số dư khả dụng</p>
                <h2 class="text-2xl font-black text-[#c0f135]" id="balance-val">$0.00</h2>
                <button onclick="logout()" class="text-xs text-red-400 underline pt-2">Đăng xuất</button>
            </div>
        </div>

    </div>

    <script>
        let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;

        // Tự động nhận mã ref từ URL
        const urlParams = new URLSearchParams(window.location.search);
        const refUrl = urlParams.get('ref');
        if (refUrl) localStorage.setItem('pendingRef', refUrl);

        function switchAuthMode(mode) {
            if(mode === 'register') {
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('register-form').classList.remove('hidden');
                const pRef = localStorage.getItem('pendingRef');
                if(pRef) document.getElementById('reg-refcode').value = pRef;
            } else {
                document.getElementById('register-form').classList.add('hidden');
                document.getElementById('login-form').classList.remove('hidden');
            }
        }

        function handleRegister() {
            const fullname = document.getElementById('reg-fullname').value;
            const username = document.getElementById('reg-username').value;
            if(!fullname || !username) { alert('Vui lòng điền đủ thông tin!'); return; }
            alert('Đăng ký thành công! Hãy đăng nhập.');
            switchAuthMode('login');
        }

        function handleLogin() {
            const username = document.getElementById('login-username').value;
            if(!username) { alert('Vui lòng nhập tài khoản!'); return; }
            currentUser = { username, fullname: "Thành viên" };
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            location.reload();
        }

        function logout() {
            localStorage.removeItem('currentUser');
            location.reload();
        }

        document.addEventListener("DOMContentLoaded", () => {
            if(currentUser) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('user-display').innerText = currentUser.username;
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
