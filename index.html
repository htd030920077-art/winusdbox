<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIN USDBOX - Người Chơi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-[#0b0f19] text-white font-sans min-h-screen pb-12 p-4">
    <div class="max-w-md mx-auto space-y-6">
        <h1 class="text-2xl font-bold text-emerald-400 text-center">WIN USDBOX Dashboard</h1>
        
        <!-- Thông tin tài khoản -->
        <div class="bg-gray-800 p-5 rounded-2xl border border-gray-700 space-y-2">
            <p class="text-sm text-gray-400">Tài khoản: <span id="lbl-user" class="text-white font-bold">user_demo01</span></p>
            <p class="text-sm text-gray-400">Số dư khả dụng: <span id="lbl-balance" class="text-emerald-400 font-bold text-lg">0 đ</span></p>
            <p class="text-sm text-gray-400">ID Cố Định: <span id="lbl-id" class="font-mono text-cyan-400 font-bold">WIN982341</span></p>
        </div>

        <!-- Mua gói VIP -->
        <div class="bg-gray-800 p-5 rounded-2xl border border-gray-700 space-y-3">
            <h3 class="font-bold text-amber-400"><i class="fa-solid fa-crown mr-2"></i>Kích Hoạt Gói Đầu Tư</h3>
            <select id="packageSelect" class="w-full px-4 py-2 bg-gray-900 rounded-xl border border-gray-700 text-sm">
                <option value="3">VIP 1 - 3 USD (~75,000 đ)</option>
                <option value="20">VIP 2 - 20 USD</option>
                <option value="50">VIP 3 - 50 USD</option>
                <option value="100">VIP 6 - 100 USD</option>
            </select>
            <button onclick="buyPackage()" class="w-full bg-amber-600 hover:bg-amber-500 py-2.5 rounded-xl font-bold text-sm transition">Mua Gói Ngay</button>
        </div>

        <!-- Nạp tiền -->
        <div class="bg-gray-800 p-5 rounded-2xl border border-gray-700 space-y-3">
            <h3 class="font-bold text-emerald-400"><i class="fa-solid fa-wallet mr-2"></i>Nạp Tiền</h3>
            <input type="number" id="napAmount" placeholder="Nhập số tiền nạp (VNĐ)" class="w-full px-4 py-2 bg-gray-900 rounded-xl border border-gray-700 text-sm">
            <input type="text" id="napContent" placeholder="Nội dung chuyển khoản" class="w-full px-4 py-2 bg-gray-900 rounded-xl border border-gray-700 text-sm">
            <button onclick="submitNap()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded-xl font-bold text-sm transition">Xác Nhận Nạp Tiền</button>
            <p class="text-[11px] text-gray-400 italic text-center">KHI QUÝ KHÁCH ĐÃ CHUYỂN TIỀN VUI LÒNG ẤN ĐÃ CHUYỂN KHOẢN XONG</p>
        </div>

        <!-- Rút tiền -->
        <div class="bg-gray-800 p-5 rounded-2xl border border-gray-700 space-y-3">
            <h3 class="font-bold text-rose-400"><i class="fa-solid fa-money-bill-transfer mr-2"></i>Rút Tiền (Phí 5%)</h3>
            <input type="number" id="rutAmount" placeholder="Số tiền rút (Tối thiểu 2.600đ ~ 0.1$)" oninput="calcFee()" class="w-full px-4 py-2 bg-gray-900 rounded-xl border border-gray-700 text-sm">
            <p class="text-xs text-rose-300" id="feeText">Phí rút: 0 đ (Thực nhận: 0 đ)</p>
            <div id="bankInfoBox" class="space-y-2">
                <input type="text" id="bankName" placeholder="Tên ngân hàng & Số TK" class="w-full px-4 py-2 bg-gray-900 rounded-xl border border-gray-700 text-sm">
            </div>
            <button onclick="submitRut()" class="w-full bg-rose-600 hover:bg-rose-500 py-2.5 rounded-xl font-bold text-sm transition">Gửi Lệnh Rút</button>
        </div>

        <!-- Nhiệm vụ điểm danh 24h -->
        <div class="bg-gray-800 p-5 rounded-2xl border border-gray-700 space-y-3 text-center">
            <h3 class="font-bold text-cyan-400"><i class="fa-solid fa-calendar-check mr-2"></i>Điểm Danh Mỗi Ngày (24h/lần)</h3>
            <button onclick="dailyCheckIn()" class="w-full bg-cyan-600 hover:bg-cyan-500 py-2.5 rounded-xl font-bold text-sm transition">Điểm Danh Ngay</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC832BgFHW5LIavbuwE17dp...",
            authDomain: "winusdbox.firebaseapp.com",
            databaseURL: "https://winusdbox-default-rtdb.firebaseio.com",
            projectId: "winusdbox",
            storageBucket: "winusdbox.appspot.com",
            messagingSenderId: "665540389423",
            appId: "1:665540389423:web:7249d5d07b..."
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUsername = "user_demo01";
        let fixedID = localStorage.getItem('user_fixed_id');
        if(!fixedID) {
            fixedID = 'WIN' + Math.floor(100000 + Math.random() * 900000);
            localStorage.setItem('user_fixed_id', fixedID);
        }
        document.getElementById('lbl-id').innerText = fixedID;

        function submitNap() {
            let amount = document.getElementById('napAmount').value;
            let content = document.getElementById('napContent').value;
            if(!amount || !content) { alert('Vui lòng điền đầy đủ thông tin nạp!'); return; }
            db.ref('transactions/nap_pending').push({
                username: currentUsername,
                amount: Number(amount),
                content: content,
                time: new Date().toLocaleString()
            });
            alert('BẠN ĐÃ XÁC NHẬN NẠP TIỀN THÀNH CÔNG');
            document.getElementById('napAmount').value = '';
            document.getElementById('napContent').value = '';
        }

        function calcFee() {
            let val = Number(document.getElementById('rutAmount').value) || 0;
            let fee = val * 0.05;
            let net = val - fee;
            document.getElementById('feeText').innerText = `Phí rút (5%): ${fee.toLocaleString()} đ (Thực nhận: ${net.toLocaleString()} đ)`;
        }

        function submitRut() {
            let amount = Number(document.getElementById('rutAmount').value);
            let bank = document.getElementById('bankName').value;
            if(amount < 2600) { alert('Mức rút tiền thấp nhất là 2.600đ (0.1$)!'); return; }
            if(!bank) { alert('Vui lòng nhập thông tin ngân hàng!'); return; }
            db.ref('transactions/rut_pending').push({
                username: currentUsername,
                amount: amount,
                bankInfo: bank,
                time: new Date().toLocaleString()
            });
            alert('ĐƠN RÚT TIỀN CỦA BẠN ĐANG ĐƯỢC XỬ LÍ');
            document.getElementById('rutAmount').value = '';
        }

        function buyPackage() {
            alert('Đã gửi yêu cầu kích hoạt gói VIP! Vui lòng chuyển khoản để Admin duyệt.');
        }

        function dailyCheckIn() {
            let lastTime = localStorage.getItem('lastCheckIn') || 0;
            let now = new Date().getTime();
            if(now - lastTime < 24 * 60 * 60 * 1000) {
                alert('Bạn đã điểm danh rồi, vui lòng quay lại sau đúng 24 giờ!');
                return;
            }
            localStorage.setItem('lastCheckIn', now);
            alert('Điểm danh thành công!');
        }
    </script>
</body>
</html>
