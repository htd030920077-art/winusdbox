<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIN USDBOX - Admin Control Panel</title>
    <!-- Tailwind CSS & FontAwesome Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0b0f19;
            --neon-green: #c0f135;
        }
        body {
            background-color: var(--bg-main);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .card-dark {
            background: rgba(18, 26, 43, 0.85);
            border: 1px solid rgba(192, 241, 53, 0.15);
        }
        .neon-btn { background-color: var(--neon-green); color: #000; }
        .neon-text { color: var(--neon-green); }
    </style>
</head>
<body class="min-h-screen bg-[#0b0f19] p-4 md:p-8">

    <!-- LOGIN ADMIN SCREEN -->
    <div id="admin-login-screen" class="fixed inset-0 bg-[#0b0f19] z-50 flex items-center justify-center p-4">
        <div class="card-dark w-full max-w-sm p-6 rounded-3xl space-y-5 border border-[#c0f135]/30 shadow-2xl">
            <div class="text-center space-y-2">
                <div class="w-14 h-14 bg-[#c0f135] text-gray-950 font-black text-2xl rounded-2xl flex items-center justify-center mx-auto shadow-lg shadow-lime-500/20">
                    <i class="fa-solid fa-[#c0f135] fa-user-shield text-black"></i>
                </div>
                <h2 class="text-xl font-black text-white">ADMIN LOGIN</h2>
                <p class="text-xs text-gray-400">Hệ thống quản trị WIN USDBOX</p>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="text-xs font-bold text-gray-300">Mật khẩu Quản trị</label>
                    <input type="password" id="admin-password-input" placeholder="Nhập mật khẩu admin..." class="w-full bg-[#121929] border border-gray-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-[#c0f135] mt-1">
                </div>
                <button onclick="loginAdmin()" class="w-full neon-btn font-extrabold py-3 rounded-xl text-xs shadow-lg shadow-lime-500/20 active:scale-95 transition cursor-pointer">
                    ĐĂNG NHẬP ADMIN
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN ADMIN DASHBOARD -->
    <div id="admin-dashboard" class="max-w-5xl mx-auto space-y-6 hidden">

        <!-- HEADER -->
        <header class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 pb-4 border-b border-gray-800">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-[#c0f135] rounded-xl flex items-center justify-center text-gray-950 font-black text-lg shadow">
                    <i class="fa-solid fa-cube"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black text-white tracking-wide">BẢNG QUẢN TRỊ ADMIN</h1>
                    <p class="text-xs text-gray-400">Quản lý giao dịch nạp/rút & thành viên hệ thống</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="refreshData()" class="bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-2 transition cursor-pointer">
                    <i class="fa-solid fa-rotate"></i> Làm mới dữ liệu
                </button>
                <button onclick="logoutAdmin()" class="bg-red-950/80 hover:bg-red-900 border border-red-500/30 text-red-400 font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-2 transition cursor-pointer">
                    <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
                </button>
            </div>
        </header>

        <!-- STATS OVERVIEW -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="card-dark p-4 rounded-2xl border border-gray-800">
                <p class="text-xs text-gray-400">Tổng Thành Viên</p>
                <p class="text-xl font-black text-white mt-1" id="stat-users-count">0</p>
            </div>
            <div class="card-dark p-4 rounded-2xl border border-gray-800">
                <p class="text-xs text-gray-400">Chờ Duyệt Nạp</p>
                <p class="text-xl font-black text-amber-400 mt-1" id="stat-pending-deposit">0</p>
            </div>
            <div class="card-dark p-4 rounded-2xl border border-gray-800">
                <p class="text-xs text-gray-400">Chờ Duyệt Rút</p>
                <p class="text-xl font-black text-amber-400 mt-1" id="stat-pending-withdraw">0</p>
            </div>
            <div class="card-dark p-4 rounded-2xl border border-gray-800">
                <p class="text-xs text-gray-400">Tỷ giá Quy đổi</p>
                <p class="text-xl font-black text-[#c0f135] mt-1">26.000 VNĐ</p>
            </div>
        </div>

        <!-- TABS NAVIGATION -->
        <div class="flex border-b border-gray-800 space-x-4">
            <button onclick="switchAdminTab('deposits')" id="tab-btn-deposits" class="pb-3 text-xs font-bold border-b-2 border-[#c0f135] text-[#c0f135] cursor-pointer flex items-center gap-2">
                <i class="fa-solid fa-arrow-up-from-bracket"></i> Lệnh Nạp Tiền
            </button>
            <button onclick="switchAdminTab('withdraws')" id="tab-btn-withdraws" class="pb-3 text-xs font-bold border-b-2 border-transparent text-gray-400 hover:text-white cursor-pointer flex items-center gap-2">
                <i class="fa-solid fa-arrow-down-to-bracket"></i> Lệnh Rút Tiền
            </button>
            <button onclick="switchAdminTab('users')" id="tab-btn-users" class="pb-3 text-xs font-bold border-b-2 border-transparent text-gray-400 hover:text-white cursor-pointer flex items-center gap-2">
                <i class="fa-solid fa-users"></i> Danh Sách Thành Viên
            </button>
        </div>

        <!-- TAB 1: DUYỆT NẠP TIỀN -->
        <div id="admin-tab-deposits" class="admin-pane space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-sm font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-[#c0f135]"></i> Danh Sách Yêu Cầu Nạp Tiền
                </h3>
            </div>
            <div id="deposit-list-container" class="space-y-3"></div>
        </div>

        <!-- TAB 2: DUYỆT RÚT TIỀN -->
        <div id="admin-tab-withdraws" class="admin-pane hidden space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-sm font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-money-bill-transfer text-[#c0f135]"></i> Danh Sách Yêu Cầu Rút Tiền
                </h3>
            </div>
            <div id="withdraw-list-container" class="space-y-3"></div>
        </div>

        <!-- TAB 3: DANH SÁCH USER -->
        <div id="admin-tab-users" class="admin-pane hidden space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-sm font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-users-gear text-[#c0f135]"></i> Tất Cả Người Dùng Trong Hệ Thống
                </h3>
            </div>
            <div id="user-list-container" class="space-y-3"></div>
        </div>

    </div>

    <!-- JAVASCRIPT ADMIN LOGIC -->
    <script>
        const ADMIN_PASS = "admin123"; // Mật khẩu truy cập Admin
        const USD_TO_VND = 26000;

        const investmentPlans = [
            { id: 0, priceUsd: 0, ratePerSec: 0.000000200, title: "Gói Khai Thác Free" },
            { id: 1, priceUsd: 3, ratePerSec: 0.000003858, title: "Gói Khai Thác 3 USD" },
            { id: 2, priceUsd: 7, ratePerSec: 0.000009002, title: "Gói Khai Thác 7 USD" },
            { id: 3, priceUsd: 15, ratePerSec: 0.000019290, title: "Gói Khai Thác 15 USD" },
            { id: 4, priceUsd: 20, ratePerSec: 0.000025720, title: "Gói Khai Thác 20 USD" },
            { id: 5, priceUsd: 50, ratePerSec: 0.000057870, title: "Gói VIP 50 USD" },
            { id: 6, priceUsd: 100, ratePerSec: 0.000115740, title: "Gói VIP 100 USD" }
        ];

        let depositHistory = JSON.parse(localStorage.getItem('depositHistory')) || [];
        let withdrawHistory = JSON.parse(localStorage.getItem('withdrawHistory')) || [];
        let registeredUsers = JSON.parse(localStorage.getItem('registeredUsers')) || [];

        function loginAdmin() {
            const pass = document.getElementById('admin-password-input').value.trim();
            if (pass === ADMIN_PASS) {
                document.getElementById('admin-login-screen').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                refreshData();
            } else {
                alert("Mật khẩu Admin không chính xác!");
            }
        }

        function logoutAdmin() {
            document.getElementById('admin-login-screen').classList.remove('hidden');
            document.getElementById('admin-dashboard').classList.add('hidden');
            document.getElementById('admin-password-input').value = '';
        }

        function refreshData() {
            depositHistory = JSON.parse(localStorage.getItem('depositHistory')) || [];
            withdrawHistory = JSON.parse(localStorage.getItem('withdrawHistory')) || [];
            registeredUsers = JSON.parse(localStorage.getItem('registeredUsers')) || [];

            renderStats();
            renderDeposits();
            renderWithdraws();
            renderUsers();
        }

        function renderStats() {
            document.getElementById('stat-users-count').innerText = registeredUsers.length;
            const pendingDep = depositHistory.filter(d => d.status === "Đang chờ duyệt").length;
            const pendingWith = withdrawHistory.filter(w => w.status === "Đang chờ duyệt").length;
            document.getElementById('stat-pending-deposit').innerText = pendingDep;
            document.getElementById('stat-pending-withdraw').innerText = pendingWith;
        }

        function renderDeposits() {
            const container = document.getElementById('deposit-list-container');
            container.innerHTML = "";

            if (depositHistory.length === 0) {
                container.innerHTML = `<p class="text-center text-xs text-gray-500 py-8">Chưa có giao dịch nạp tiền nào.</p>`;
                return;
            }

            depositHistory.forEach((item, index) => {
                const isPending = item.status === "Đang chờ duyệt";
                const isSuccess = item.status === "Thành công";

                container.innerHTML += `
                    <div class="card-dark rounded-2xl p-4 flex flex-col md:flex-row md:items-center justify-between gap-3 border border-gray-800">
                        <div class="space-y-1">
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-bold text-white">Nạp ${item.vnd.toLocaleString()} VNĐ</span>
                                <span class="text-xs font-black neon-text">(${item.usd.toFixed(2)} USD)</span>
                                <span class="text-[10px] px-2 py-0.5 rounded-full font-bold ${isPending ? 'bg-amber-500/20 text-amber-400' : isSuccess ? 'bg-[#c0f135]/20 text-[#c0f135]' : 'bg-red-500/20 text-red-400'}">${item.status}</span>
                            </div>
                            <p class="text-[11px] text-gray-400">Thời gian tạo: ${item.time}</p>
                        </div>

                        ${isPending ? `
                            <div class="flex items-center gap-2">
                                <button onclick="adminApproveDeposit(${index})" class="neon-btn font-extrabold px-4 py-2 rounded-xl text-xs active:scale-95 transition shadow cursor-pointer">
                                    <i class="fa-solid fa-check mr-1"></i> DUYỆT NẠP
                                </button>
                                <button onclick="adminRejectDeposit(${index})" class="bg-red-950 border border-red-500/30 text-red-400 font-bold px-4 py-2 rounded-xl text-xs hover:bg-red-900 transition cursor-pointer">
                                    TỪ CHỐI
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            });
        }

        function adminApproveDeposit(index) {
            if (!depositHistory[index]) return;
            const item = depositHistory[index];
            item.status = "Thành công";
            localStorage.setItem('depositHistory', JSON.stringify(depositHistory));

            // Kích hoạt gói đầu tư khớp số tiền
            let matchedPlan = investmentPlans.find(p => p.priceUsd === Math.round(item.usd)) || investmentPlans[1];
            localStorage.setItem('activePlanId', matchedPlan.id);

            // Cập nhật hoa hồng và trạng thái
            let currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (currentUser) {
                const prefix = currentUser.username;
                let balance = parseFloat(localStorage.getItem(`availableBalance_${prefix}`)) || 0;
                balance += item.usd;
                localStorage.setItem(`availableBalance_${prefix}`, balance);
            }

            alert(`Đã duyệt lệnh nạp ${item.usd.toFixed(2)} USD thành công!`);
            refreshData();
        }

        function adminRejectDeposit(index) {
            if (!depositHistory[index]) return;
            depositHistory[index].status = "Thất bại";
            localStorage.setItem('depositHistory', JSON.stringify(depositHistory));
            alert("Đã từ chối lệnh nạp tiền!");
            refreshData();
        }

        function renderWithdraws() {
            const container = document.getElementById('withdraw-list-container');
            container.innerHTML = "";

            if (withdrawHistory.length === 0) {
                container.innerHTML = `<p class="text-center text-xs text-gray-500 py-8">Chưa có giao dịch rút tiền nào.</p>`;
                return;
            }

            withdrawHistory.forEach((item, index) => {
                const isPending = item.status === "Đang chờ duyệt";
                const isSuccess = item.status === "Thành công";

                container.innerHTML += `
                    <div class="card-dark rounded-2xl p-4 flex flex-col md:flex-row md:items-center justify-between gap-3 border border-gray-800">
                        <div class="space-y-1">
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-bold text-white">Rút ${item.amount.toFixed(2)} USD</span>
                                <span class="text-[11px] text-gray-400">(Thực nhận: ${item.net.toFixed(2)} U)</span>
                                <span class="text-[10px] px-2 py-0.5 rounded-full font-bold ${isPending ? 'bg-amber-500/20 text-amber-400' : isSuccess ? 'bg-[#c0f135]/20 text-[#c0f135]' : 'bg-red-500/20 text-red-400'}">${item.status}</span>
                            </div>
                            <p class="text-[11px] text-gray-300">Ngân hàng: <strong class="text-[#c0f135]">${item.bank}</strong> | STK: <strong class="text-white">${item.acc}</strong> | Chủ TK: <strong class="text-white">${item.name}</strong></p>
                            <p class="text-[10px] text-gray-400">Thời gian tạo: ${item.time}</p>
                        </div>

                        ${isPending ? `
                            <div class="flex items-center gap-2">
                                <button onclick="adminApproveWithdraw(${index})" class="neon-btn font-extrabold px-4 py-2 rounded-xl text-xs active:scale-95 transition shadow cursor-pointer">
                                    <i class="fa-solid fa-check mr-1"></i> DUYỆT RÚT
                                </button>
                                <button onclick="adminRejectWithdraw(${index})" class="bg-red-950 border border-red-500/30 text-red-400 font-bold px-4 py-2 rounded-xl text-xs hover:bg-red-900 transition cursor-pointer">
                                    TỪ CHỐI
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            });
        }

        function adminApproveWithdraw(index) {
            if (!withdrawHistory[index]) return;
            const item = withdrawHistory[index];

            item.status = "Thành công";
            localStorage.setItem('withdrawHistory', JSON.stringify(withdrawHistory));

            // Trừ số dư người dùng
            let currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (currentUser) {
                const prefix = currentUser.username;
                let balance = parseFloat(localStorage.getItem(`availableBalance_${prefix}`)) || 0;
                balance = Math.max(0, balance - item.amount);
                localStorage.setItem(`availableBalance_${prefix}`, balance);
            }

            alert(`Đã duyệt chuyển khoản ${item.net.toFixed(2)} USD cho tài khoản ${item.name}!`);
            refreshData();
        }

        function adminRejectWithdraw(index) {
            if (!withdrawHistory[index]) return;
            withdrawHistory[index].status = "Thất bại";
            localStorage.setItem('withdrawHistory', JSON.stringify(withdrawHistory));
            alert("Đã từ chối lệnh rút tiền!");
            refreshData();
        }

        function renderUsers() {
            const container = document.getElementById('user-list-container');
            container.innerHTML = "";

            if (registeredUsers.length === 0) {
                container.innerHTML = `<p class="text-center text-xs text-gray-500 py-8">Chưa có người dùng nào đăng ký.</p>`;
                return;
            }

            registeredUsers.forEach(u => {
                const prefix = u.username;
                const balance = parseFloat(localStorage.getItem(`availableBalance_${prefix}`)) || 0.00;

                container.innerHTML += `
                    <div class="card-dark rounded-2xl p-4 flex items-center justify-between border border-gray-800">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-[#c0f135]/10 text-[#c0f135] font-black flex items-center justify-center text-sm">
                                <i class="fa-solid fa-user"></i>
                            </div>
                            <div>
                                <p class="text-xs font-bold text-white">${u.fullname}</p>
                                <p class="text-[11px] text-gray-400">SĐT/Email: ${u.username} | Pass: ${u.password}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-xs font-black neon-text">$${balance.toFixed(2)} USD</p>
                            <p class="text-[10px] text-gray-500">Số dư hiện tại</p>
                        </div>
                    </div>
                `;
            });
        }

        function switchAdminTab(tabName) {
            document.querySelectorAll('.admin-pane').forEach(p => p.classList.add('hidden'));
            document.getElementById(`admin-tab-${tabName}`).classList.remove('hidden');

            ['deposits', 'withdraws', 'users'].forEach(t => {
                const btn = document.getElementById(`tab-btn-${t}`);
                if (t === tabName) {
                    btn.className = "pb-3 text-xs font-bold border-b-2 border-[#c0f135] text-[#c0f135] cursor-pointer flex items-center gap-2";
                } else {
                    btn.className = "pb-3 text-xs font-bold border-b-2 border-transparent text-gray-400 hover:text-white cursor-pointer flex items-center gap-2";
                }
            });
        }
    </script>
</body>
</html>
