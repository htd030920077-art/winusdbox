<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIN USDBOX - Admin Control Panel Pro</title>
    <!-- Tailwind CSS & FontAwesome Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #070b14;
            --neon-rose: #f43f5e;
            --neon-green: #c0f135;
        }
        body {
            background-color: var(--bg-main);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }
        .grid-bg {
            background-image: linear-gradient(rgba(244, 63, 94, 0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(244, 63, 94, 0.02) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .card-dark {
            background: rgba(17, 24, 39, 0.85);
            border: 1px solid rgba(244, 63, 94, 0.2);
        }
        .rose-btn { background-color: var(--neon-rose); color: #fff; }
        .rose-text { color: var(--neon-rose); }
        .neon-btn { background-color: var(--neon-green); color: #000; }
        .neon-text { color: var(--neon-green); }
    </style>
</head>
<body class="flex justify-center min-h-screen">

    <div class="w-full max-w-md bg-[#070b14] flex flex-col justify-between min-h-screen relative grid-bg pb-16 shadow-2xl border-x border-gray-800 overflow-hidden">

        <!-- MÀN HÌNH ĐĂNG NHẬP ADMIN -->
        <div id="admin-auth-screen" class="fixed inset-0 bg-[#070b14] z-[100] flex items-center justify-center p-6">
            <div class="w-full max-w-sm space-y-6">
                <div class="text-center space-y-2">
                    <div class="w-16 h-16 bg-gradient-to-tr from-rose-600 to-pink-500 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl font-black shadow-lg shadow-rose-600/30">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <h1 class="text-2xl font-black text-white tracking-wide">ADMIN CONTROL PRO</h1>
                    <p class="text-xs text-gray-400">Hệ thống quản trị thời gian thực WIN USDBOX</p>
                </div>

                <div class="space-y-4">
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-gray-300">Mật khẩu quản trị</label>
                        <input type="password" id="admin-pass-input" placeholder="Nhập mật khẩu (td0309)..." class="w-full bg-[#111827] border border-gray-800 rounded-xl p-3.5 text-xs text-gray-200 focus:outline-none focus:border-rose-500 placeholder-gray-600">
                    </div>
                    <button onclick="handleAdminLogin()" class="w-full rose-btn font-extrabold py-3.5 rounded-xl text-xs tracking-wider shadow-lg shadow-rose-600/25 active:scale-95 transition cursor-pointer">
                        TRUY CẬP HỆ THỐNG
                    </button>
                </div>
            </div>
        </div>

        <!-- HEADER QUẢN TRỊ -->
        <header class="w-full px-4 py-3 flex items-center justify-between border-b border-gray-800/80 bg-[#070b14]/90 sticky top-0 z-30">
            <div class="flex items-center gap-2">
                <div class="w-7 h-7 bg-rose-600 rounded-lg flex items-center justify-center text-white font-black text-xs shadow">
                    <i class="fa-solid fa-gauge-high"></i>
                </div>
                <span class="font-black text-sm tracking-wider text-white">ADMIN PRO</span>
            </div>
            
            <div class="flex items-center gap-2">
                <!-- NÚT KHÓA / MỞ SERVER NHANH -->
                <button id="server-lock-toggle-btn" onclick="toggleServerLock()" class="px-2.5 py-1.5 rounded-xl bg-emerald-950/80 border border-emerald-500/40 text-[10px] font-extrabold text-emerald-400 hover:bg-emerald-900 transition cursor-pointer flex items-center gap-1">
                    <i class="fa-solid fa-lock-open" id="server-lock-icon"></i> <span id="server-lock-text">SERVER: MỞ</span>
                </button>

                <span id="sync-status" class="text-[10px] text-emerald-400 bg-emerald-950/60 border border-emerald-500/30 px-2 py-0.5 rounded-full font-semibold hidden">
                    <i class="fa-solid fa-circle text-[8px] animate-pulse"></i> Live
                </span>
                <a href="index.html" class="px-2.5 py-1.5 rounded-xl bg-gray-900 border border-gray-800 text-xs font-semibold text-sky-400 hover:bg-gray-800 transition cursor-pointer" title="Quay lại Web Người Chơi">
                    <i class="fa-solid fa-house"></i>
                </a>
                <button onclick="handleAdminLogout()" class="px-2.5 py-1.5 rounded-xl bg-gray-900 border border-gray-800 text-xs font-semibold text-rose-400 hover:bg-gray-800 transition cursor-pointer">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </header>

        <!-- NỘI DUNG QUẢN TRỊ CHÍNH -->
        <main class="p-4 space-y-4 overflow-y-auto flex-1">
            
            <!-- THỐNG KÊ TỔNG QUAN -->
            <div class="grid grid-cols-2 gap-3">
                <div class="card-dark rounded-2xl p-3.5 border border-gray-800 space-y-1">
                    <p class="text-[10px] text-gray-400 font-medium">Lệnh Nạp Chờ Duyệt</p>
                    <h2 class="text-xl font-black text-emerald-400" id="stat-pending-deposit">0</h2>
                </div>
                <div class="card-dark rounded-2xl p-3.5 border border-gray-800 space-y-1">
                    <p class="text-[10px] text-gray-400 font-medium">Lệnh Rút Chờ Duyệt</p>
                    <h2 class="text-xl font-black text-rose-400" id="stat-pending-withdraw">0</h2>
                </div>
            </div>

            <!-- TABS ĐIỀU HƯỚNG ADMIN -->
            <div class="grid grid-cols-4 gap-1 bg-[#111827] p-1 rounded-xl border border-gray-800 text-[11px] font-semibold text-center">
                <button onclick="switchAdminTab('deposits')" id="tab-btn-deposits" class="py-2 rounded-lg transition rose-btn shadow font-bold">Nạp Tiền</button>
                <button onclick="switchAdminTab('withdraws')" id="tab-btn-withdraws" class="py-2 rounded-lg text-gray-400 transition hover:text-white">Rút Tiền</button>
                <button onclick="switchAdminTab('users')" id="tab-btn-users" class="py-2 rounded-lg text-gray-400 transition hover:text-white">Thành Viên</button>
                <button onclick="switchAdminTab('giftcode')" id="tab-btn-giftcode" class="py-2 rounded-lg text-gray-400 transition hover:text-white">Giftcode</button>
            </div>

            <!-- 1. TAB NẠP TIỀN -->
            <div id="admin-tab-deposits" class="admin-pane space-y-3">
                <div class="flex justify-between items-center px-1">
                    <h3 class="font-bold text-xs text-gray-300 uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-arrow-up-from-bracket text-emerald-400"></i> Quản lý Nạp Tiền
                    </h3>
                    <button onclick="loadAdminData()" class="text-[10px] text-rose-400 hover:underline"><i class="fa-solid fa-rotate"></i> Làm mới</button>
                </div>
                <div id="admin-deposit-list" class="space-y-3"></div>
            </div>

            <!-- 2. TAB RÚT TIỀN -->
            <div id="admin-tab-withdraws" class="admin-pane space-y-3 hidden">
                <div class="flex justify-between items-center px-1">
                    <h3 class="font-bold text-xs text-gray-300 uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-arrow-down-to-bracket text-rose-400"></i> Quản lý Rút Tiền
                    </h3>
                    <button onclick="loadAdminData()" class="text-[10px] text-rose-400 hover:underline"><i class="fa-solid fa-rotate"></i> Làm mới</button>
                </div>
                <div id="admin-withdraw-list" class="space-y-3"></div>
            </div>

            <!-- 3. TAB THÀNH VIÊN -->
            <div id="admin-tab-users" class="admin-pane space-y-3 hidden">
                <div class="flex justify-between items-center px-1">
                    <h3 class="font-bold text-xs text-gray-300 uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-users text-sky-400"></i> Quản lý Thành Viên
                    </h3>
                    <span id="total-users-count" class="text-[10px] bg-sky-950 text-sky-400 px-2 py-0.5 rounded-full font-bold">0 thành viên</span>
                </div>
                
                <!-- Thanh tìm kiếm thành viên -->
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-gray-500 text-xs"></i>
                    <input type="text" id="user-search-input" oninput="filterAdminUsers()" placeholder="Tìm kiếm theo SĐT, họ tên..." class="w-full bg-[#111827] border border-gray-800 rounded-xl pl-9 pr-3 py-2.5 text-xs text-white focus:outline-none focus:border-sky-500 placeholder-gray-500">
                </div>

                <div id="admin-users-list" class="space-y-3"></div>
            </div>

            <!-- 4. TAB GIFTCODE -->
            <div id="admin-tab-giftcode" class="admin-pane space-y-4 hidden">
                <div class="card-dark rounded-2xl p-4 space-y-3 border border-rose-500/30">
                    <h3 class="font-bold text-sm text-rose-400 flex items-center gap-2">
                        <i class="fa-solid fa-ticket-simple"></i> Tạo Mã Giftcode Mới
                    </h3>
                    <div class="space-y-2.5 text-xs">
                        <div class="space-y-1">
                            <label class="font-bold text-gray-300">Mã Giftcode (VD: TET2026, KM50K...)</label>
                            <input type="text" id="admin-code-input" placeholder="Nhập mã code..." class="w-full bg-[#070b14] border border-gray-800 rounded-xl p-3 text-xs text-white uppercase focus:outline-none focus:border-rose-500">
                        </div>
                        <div class="space-y-1">
                            <label class="font-bold text-gray-300">Số tiền thưởng (USD)</label>
                            <input type="number" id="admin-usd-input" step="0.01" placeholder="VD: 1.00 (tương đương 26k)" class="w-full bg-[#070b14] border border-gray-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-rose-500">
                        </div>
                        <div class="space-y-1">
                            <label class="font-bold text-gray-300">Giới hạn lượt nhập tối đa</label>
                            <input type="number" id="admin-limit-input" value="50" class="w-full bg-[#070b14] border border-gray-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-rose-500">
                        </div>
                        <button onclick="adminCreateGiftcode()" class="w-full rose-btn font-extrabold py-3.5 rounded-xl text-xs active:scale-95 transition shadow-lg cursor-pointer mt-1">
                            Tạo & Kích Hoạt Giới Hạn
                        </button>
                    </div>
                </div>

                <div class="card-dark rounded-2xl p-4 space-y-3 border border-gray-800">
                    <h3 class="font-bold text-xs text-gray-300"><i class="fa-solid fa-list mr-1 text-rose-400"></i> Danh sách Giftcode đang hoạt động:</h3>
                    <div id="admin-giftcode-list" class="space-y-2 max-h-56 overflow-y-auto"></div>
                </div>
            </div>

        </main>
    </div>

    <!-- MODAL CHỈNH SỬA THÔNG TIN THÀNH VIÊN -->
    <div id="edit-user-modal" class="fixed inset-0 bg-black/80 z-[120] hidden items-center justify-center p-4">
        <div class="bg-[#111827] border border-sky-500/40 rounded-3xl p-5 w-full max-w-sm space-y-4 shadow-2xl relative">
            <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                <h3 class="text-sm font-bold text-sky-400"><i class="fa-solid fa-user-pen mr-1"></i> Chỉnh sửa thành viên</h3>
                <button onclick="closeEditUserModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <input type="hidden" id="edit-user-key">

            <div class="space-y-3 text-xs">
                <div class="space-y-1">
                    <label class="font-bold text-gray-300">Họ và tên</label>
                    <input type="text" id="edit-fullname" class="w-full bg-[#070b14] border border-gray-800 rounded-xl p-2.5 text-gray-200 focus:outline-none focus:border-sky-500">
                </div>
                <div class="space-y-1">
                    <label class="font-bold text-gray-300">Số điện thoại / Email (Tài khoản)</label>
                    <input type="text" id="edit-username" class="w-full bg-[#070b14] border border-gray-800 rounded-xl p-2.5 text-gray-200 focus:outline-none focus:border-sky-500">
                </div>
                <div class="space-y-1">
                    <label class="font-bold text-gray-300">Mật khẩu</label>
                    <input type="text" id="edit-password" class="w-full bg-[#070b14] border border-gray-800 rounded-xl p-2.5 text-gray-200 focus:outline-none focus:border-sky-500">
                </div>
                <div class="space-y-1">
                    <label class="font-bold text-gray-300">Số dư ví (USD)</label>
                    <input type="number" step="0.01" id="edit-balance" class="w-full bg-[#070b14] border border-gray-800 rounded-xl p-2.5 text-gray-200 focus:outline-none focus:border-sky-500">
                </div>
                <div class="space-y-1">
                    <label class="font-bold text-gray-300">Ngân hàng & Số tài khoản nhận</label>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="edit-bank-name" placeholder="Tên NH (VD: MB)" class="bg-[#070b14] border border-gray-800 rounded-xl p-2.5 text-gray-200 focus:outline-none focus:border-sky-500">
                        <input type="text" id="edit-bank-acc" placeholder="Số TK" class="bg-[#070b14] border border-gray-800 rounded-xl p-2.5 text-gray-200 focus:outline-none focus:border-sky-500">
                    </div>
                </div>
                <div class="space-y-1">
                    <label class="font-bold text-gray-300">Tên chủ tài khoản ngân hàng</label>
                    <input type="text" id="edit-bank-holder" placeholder="Họ tên không dấu..." class="w-full bg-[#070b14] border border-gray-800 rounded-xl p-2.5 text-gray-200 focus:outline-none focus:border-sky-500">
                </div>
            </div>

            <div class="pt-2 flex gap-2">
                <button onclick="closeEditUserModal()" class="w-1/2 bg-gray-800 text-gray-300 font-bold py-2.5 rounded-xl text-xs">Hủy</button>
                <button onclick="saveEditedUser()" class="w-1/2 bg-sky-600 hover:bg-sky-500 text-white font-extrabold py-2.5 rounded-xl text-xs shadow cursor-pointer">Lưu thay đổi</button>
            </div>
        </div>
    </div>

    <!-- MODAL XEM LỊCH SỬ THÀNH VIÊN -->
    <div id="user-history-modal" class="fixed inset-0 bg-black/80 z-[120] hidden items-center justify-center p-4">
        <div class="bg-[#111827] border border-sky-500/40 rounded-3xl p-5 w-full max-w-sm space-y-4 shadow-2xl relative max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                <h3 class="text-sm font-bold text-sky-400" id="history-modal-title">Lịch sử giao dịch</h3>
                <button onclick="closeUserHistoryModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div id="user-history-content" class="space-y-3 text-xs"></div>

            <button onclick="closeUserHistoryModal()" class="w-full bg-gray-800 text-white font-bold py-2.5 rounded-xl text-xs cursor-pointer">Đóng</button>
        </div>
    </div>

    <!-- JAVASCRIPT ADMIN LOGIC + FIREBASE REALTIME SYNC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, set, get, update, onValue, remove, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC832BgFHw5LIavbuwE17dpIFeJayKRbfg",
            authDomain: "winusdbox.firebaseapp.com",
            projectId: "winusdbox",
            storageBucket: "winusdbox.firebasestorage.app",
            messagingSenderId: "665540389423",
            appId: "1:665540389423:web:7249d5d07b5629a4db34da",
            measurementId: "G-KZKL342PD7",
            databaseURL: "https://winusdbox-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let isAdminLoggedIn = localStorage.getItem('isAdminLoggedIn') === 'true';
        let realTimeDeposits = [];
        let realTimeWithdraws = [];
        let realTimeUsers = [];
        let isServerLocked = false;

        let giftcodeDatabase = JSON.parse(localStorage.getItem('giftcodeDatabase')) || {
            "WIN2026": { usd: 1.00, limit: 100, usedCount: 0 },
            "VIP5U": { usd: 5.00, limit: 10, usedCount: 0 }
        };

        window.handleAdminLogin = function() {
            const pass = document.getElementById('admin-pass-input').value.trim();
            if (pass === "td0309") {
                isAdminLoggedIn = true;
                localStorage.setItem('isAdminLoggedIn', 'true');
                checkAdminAuth();
            } else {
                alert("Mật khẩu quản trị không chính xác! (Mật khẩu: td0309)");
            }
        }

        window.handleAdminLogout = function() {
            isAdminLoggedIn = false;
            localStorage.removeItem('isAdminLoggedIn');
            checkAdminAuth();
        }

        function checkAdminAuth() {
            const authScreen = document.getElementById('admin-auth-screen');
            if (isAdminLoggedIn) {
                authScreen.classList.add('hidden');
                initFirebaseListeners();
                renderAdminGiftcodeList();
            } else {
                authScreen.classList.remove('hidden');
            }
        }

        // HÀM BẬT / TẮT KHÓA SERVER (BẢO TRÌ HỆ THỐNG)
        window.toggleServerLock = function() {
            isServerLocked = !isServerLocked;
            set(ref(db, 'system/isServerLocked'), isServerLocked)
                .then(() => {
                    updateServerLockButtonUI(isServerLocked);
                })
                .catch((err) => {
                    alert("Lỗi cập nhật trạng thái server: " + err.message);
                });
        }

        function updateServerLockButtonUI(locked) {
            const btn = document.getElementById('server-lock-toggle-btn');
            const icon = document.getElementById('server-lock-icon');
            const text = document.getElementById('server-lock-text');
            if (!btn) return;

            if (locked) {
                btn.className = "px-2.5 py-1.5 rounded-xl bg-rose-950/80 border border-rose-500/40 text-[10px] font-extrabold text-rose-400 hover:bg-rose-900 transition cursor-pointer flex items-center gap-1";
                icon.className = "fa-solid fa-lock";
                text.innerText = "SERVER: ĐÃ KHÓA";
            } else {
                btn.className = "px-2.5 py-1.5 rounded-xl bg-emerald-950/80 border border-emerald-500/40 text-[10px] font-extrabold text-emerald-400 hover:bg-emerald-900 transition cursor-pointer flex items-center gap-1";
                icon.className = "fa-solid fa-lock-open";
                text.innerText = "SERVER: MỞ";
            }
        }

        window.switchAdminTab = function(tabName) {
            document.querySelectorAll('.admin-pane').forEach(pane => pane.classList.add('hidden'));
            document.getElementById(`admin-tab-${tabName}`).classList.remove('hidden');

            ['deposits', 'withdraws', 'users', 'giftcode'].forEach(t => {
                const btn = document.getElementById(`tab-btn-${t}`);
                if (t === tabName) {
                    btn.className = "py-2 rounded-lg transition rose-btn shadow font-bold";
                } else {
                    btn.className = "py-2 rounded-lg text-gray-400 transition hover:text-white";
                }
            });
        }

        window.adminCreateGiftcode = function() {
            const code = document.getElementById('admin-code-input').value.trim().toUpperCase();
            const usd = parseFloat(document.getElementById('admin-usd-input').value) || 0;
            const limit = parseInt(document.getElementById('admin-limit-input').value) || 1;

            if (!code || usd <= 0) {
                alert("Vui lòng nhập mã code và số USD thưởng hợp lệ!");
                return;
            }

            giftcodeDatabase = JSON.parse(localStorage.getItem('giftcodeDatabase')) || giftcodeDatabase;
            if (giftcodeDatabase.hasOwnProperty(code)) {
                alert("Mã giftcode này đã tồn tại trong hệ thống!");
                return;
            }

            giftcodeDatabase[code] = { usd: usd, limit: limit, usedCount: 0 };
            localStorage.setItem('giftcodeDatabase', JSON.stringify(giftcodeDatabase));

            document.getElementById('admin-code-input').value = '';
            document.getElementById('admin-usd-input').value = '';
            renderAdminGiftcodeList();
            alert(`Đã tạo mã thành công: ${code} (${usd} USD - Giới hạn tối đa: ${limit} lượt)!`);
        }

        window.renderAdminGiftcodeList = function() {
            const container = document.getElementById('admin-giftcode-list');
            if(!container) return;
            container.innerHTML = "";
            giftcodeDatabase = JSON.parse(localStorage.getItem('giftcodeDatabase')) || giftcodeDatabase;

            for (const [code, info] of Object.entries(giftcodeDatabase)) {
                container.innerHTML += `
                    <div class="bg-gray-900 border border-gray-800 rounded-xl p-3 flex items-center justify-between text-xs">
                        <div>
                            <span class="font-extrabold text-rose-400">${code}</span>
                            <p class="text-[10px] text-gray-400">Thưởng: $${info.usd.toFixed(2)} | Đã dùng: ${info.usedCount}/${info.limit} lượt</p>
                        </div>
                        <button onclick="adminDeleteGiftcode('${code}')" class="bg-red-950/80 text-rose-400 border border-red-500/30 px-2.5 py-1 rounded-lg text-[10px] font-bold cursor-pointer">Xóa</button>
                    </div>
                `;
            }
        }

        window.adminDeleteGiftcode = function(code) {
            giftcodeDatabase = JSON.parse(localStorage.getItem('giftcodeDatabase')) || giftcodeDatabase;
            delete giftcodeDatabase[code];
            localStorage.setItem('giftcodeDatabase', JSON.stringify(giftcodeDatabase));
            renderAdminGiftcodeList();
        }

        function initFirebaseListeners() {
            onValue(ref(db, 'system/isServerLocked'), (snapshot) => {
                isServerLocked = snapshot.val() === true;
                updateServerLockButtonUI(isServerLocked);
            });

            onValue(ref(db, 'deposits'), (snapshot) => {
                const data = snapshot.val() || {};
                realTimeDeposits = Object.keys(data).map(key => ({ firebaseKey: key, ...data[key] })).reverse();
                
                const pendingCount = realTimeDeposits.filter(item => item.status === "Đang chờ duyệt").length;
                document.getElementById('stat-pending-deposit').innerText = pendingCount;
                renderAdminDeposits(realTimeDeposits);
                renderAdminUsers(realTimeUsers);
            });

            onValue(ref(db, 'withdraws'), (snapshot) => {
                const data = snapshot.val() || {};
                realTimeWithdraws = Object.keys(data).map(key => ({ firebaseKey: key, ...data[key] })).reverse();

                const pendingCount = realTimeWithdraws.filter(item => item.status === "Đang chờ duyệt").length;
                document.getElementById('stat-pending-withdraw').innerText = pendingCount;
                renderAdminWithdraws(realTimeWithdraws);
                renderAdminUsers(realTimeUsers);
            });

            onValue(ref(db, 'users'), (snapshot) => {
                const data = snapshot.val() || {};

            else if (planUsd === 15) ratePerSec = 0.000019290;
            else if (planUsd === 20) ratePerSec = 0.000025720;

            const timeString = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()} - ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

        // HÀM DUYỆT NẠP TIỀN & CỘNG HOA HỒNG TRỰC TIẾP VÀO VÍ VỚI ĐỊNH DẠNG SỐ AN TOÀN
        window.adminApproveDeposit = function(firebaseKey) {
            const item = realTimeDeposits.find(d => d.firebaseKey === firebaseKey);
            if (!item) return;

            // 1. Cập nhật trạng thái lệnh nạp thành công
            update(ref(db, 'deposits/' + firebaseKey), { status: "Thành công" });

            // 2. Truy vấn trực tiếp toàn bộ users từ Firebase để xử lý chính xác
            get(ref(db, 'users')).then((snapshot) => {
                const allUsersData = snapshot.val() || {};
                let targetUserKey = null;
                let targetUserData = null;

                Object.keys(allUsersData).forEach(key => {
                    if (allUsersData[key].username === item.username) {
                        targetUserKey = key;
                        targetUserData = allUsersData[key];
                    }
                });

                if (targetUserKey && targetUserData) {
                    const currentBal = parseFloat(targetUserData.balance) || 0;
                    const currentTotalDep = parseFloat(targetUserData.totalDepositUsd) || 0;
                    
                    const newBal = currentBal + item.usd;
                    const newTotalDeposit = currentTotalDep + item.usd;

                    // Cộng tiền nạp và cập nhật tổng nạp cho user
                    update(ref(db, 'users/' + targetUserKey), { 
                        balance: Number(newBal.toFixed(2)),
                        totalDepositUsd: Number(newTotalDeposit.toFixed(2))
                    });

                    // 3. Tiến hành phân bổ hoa hồng đa cấp cho tuyến trên (F1: 10%, F2: 3%, F3: 2%)
                    distributeMultiLevelCommission(allUsersData, targetUserData.username, item.usd);
                }
            }).catch((error) => {
                console.error("Lỗi duyệt nạp tiền:", error);
            });

            // 4. Gửi thông báo đến thành viên
            let appNotifications = JSON.parse(localStorage.getItem('appNotifications')) || [];
            const now = new Date();
            const timeString = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()} - ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            appNotifications.unshift({
                title: "Nạp tiền thành công",
                content: `Lệnh nạp $${item.usd.toFixed(2)} USD đã được admin duyệt thành công vào ví!`,
                time: timeString
            });
            localStorage.setItem('appNotifications', JSON.stringify(appNotifications));
            localStorage.setItem('hasUnreadNotif', 'true');

            alert("Đã duyệt lệnh nạp tiền thành công, cộng số dư ví, cập nhật tổng nạp và phân bổ hoa hồng vào số dư ví tuyến trên!");
        }

        // HÀM PHÂN BỔ HOA HỒNG ĐA CẤP (F1: 10%, F2: 3%, F3: 2%) ĐÃ ÉP KIỂU SỐ AN TOÀN
        function distributeMultiLevelCommission(allUsersObj, depositorUsername, depositUsdAmount) {
            let usersArray = Object.keys(allUsersObj).map(key => ({
                firebaseKey: key,
                ...allUsersObj[key]
            }));

            // Tìm thông tin của cấp dưới vừa nạp tiền
            let depositor = usersArray.find(u => u.username === depositorUsername);
            if (!depositor || !depositor.refBy) return;

            // --- XỬ LÝ F1 (10%) ---
            let f1Phone = depositor.refBy;
            let f1User = usersArray.find(u => u.username === f1Phone);

            if (f1User) {
                let commF1 = depositUsdAmount * 0.10;
                let currentBalF1 = parseFloat(f1User.balance) || 0;
                let newBalF1 = currentBalF1 + commF1;
                
                // Cập nhật trực tiếp số dư ví cho F1
                update(ref(db, 'users/' + f1User.firebaseKey), { balance: Number(newBalF1.toFixed(2)) });

                // --- XỬ LÝ F2 (3%) ---
                if (f1User.refBy) {
                    let f2Phone = f1User.refBy;
                    let f2User = usersArray.find(u => u.username === f2Phone);
                    if (f2User) {
                        let commF2 = depositUsdAmount * 0.03;
                        let currentBalF2 = parseFloat(f2User.balance) || 0;
                        let newBalF2 = currentBalF2 + commF2;

                        // Cập nhật trực tiếp số dư ví cho F2
                        update(ref(db, 'users/' + f2User.firebaseKey), { balance: Number(newBalF2.toFixed(2)) });

                        // --- XỬ LÝ F3 (2%) ---
                        if (f2User.refBy) {
                            let f3Phone = f2User.refBy;
                            let f3User = usersArray.find(u => u.username === f3Phone);
                            if (f3User) {
                                let commF3 = depositUsdAmount * 0.02;
                                let currentBalF3 = parseFloat(f3User.balance) || 0;
                                let newBalF3 = currentBalF3 + commF3;

                                // Cập nhật trực tiếp số dư ví cho F3
                                update(ref(db, 'users/' + f3User.firebaseKey), { balance: Number(newBalF3.toFixed(2)) });
                            }
                        }
                    }
                }
            }
        }

        window.adminRejectDeposit = function(firebaseKey) {
            const item = realTimeDeposits.find(d => d.firebaseKey === firebaseKey);
            if (!item) return;

            update(ref(db, 'deposits/' + firebaseKey), { status: "Đã từ chối" });
            alert("Đã từ chối lệnh nạp tiền!");
        }

        window.adminApproveWithdraw = function(firebaseKey) {
            const item = realTimeWithdraws.find(w => w.firebaseKey === firebaseKey);
            if (!item) return;

            update(ref(db, 'withdraws/' + firebaseKey), { status: "Thành công" });
            alert("Đã duyệt xác nhận chuyển khoản rút tiền thành công!");
        }

        window.adminRejectWithdraw = function(firebaseKey) {
            const item = realTimeWithdraws.find(w => w.firebaseKey === firebaseKey);
            if (!item) return;

            update(ref(db, 'withdraws/' + firebaseKey), { status: "Đã từ chối" });

            const targetUser = realTimeUsers.find(u => u.username === item.username);
            if (targetUser) {
                const refundBal = (parseFloat(targetUser.balance) || 0) + item.amount;
                update(ref(db, 'users/' + targetUser.firebaseKey), { balance: Number(refundBal.toFixed(2)) });
            }

            alert("Đã từ chối lệnh rút tiền và hoàn lại số dư cho người dùng!");
        }

        window.openEditUserModal = function(firebaseKey) {
            const user = realTimeUsers.find(u => u.firebaseKey === firebaseKey);
            if (!user) return;

            document.getElementById('edit-user-key').value = firebaseKey;
            document.getElementById('edit-fullname').value = user.fullname || '';
            document.getElementById('edit-username').value = user.username || '';
            document.getElementById('edit-password').value = user.password || '';
            document.getElementById('edit-balance').value = user.balance !== undefined ? user.balance : 0.00;
            document.getElementById('edit-bank-name').value = user.bankName || '';
            document.getElementById('edit-bank-acc').value = user.bankAcc || '';
            document.getElementById('edit-bank-holder').value = user.bankHolder || '';

            document.getElementById('edit-user-modal').classList.remove('hidden');
            document.getElementById('edit-user-modal').classList.add('flex');
        }

        window.closeEditUserModal = function() {
            document.getElementById('edit-user-modal').classList.add('hidden');
            document.getElementById('edit-user-modal').classList.remove('flex');
        }

        window.saveEditedUser = function() {
            const firebaseKey = document.getElementById('edit-user-key').value;
            const updatedData = {
                fullname: document.getElementById('edit-fullname').value.trim(),
                username: document.getElementById('edit-username').value.trim(),
                password: document.getElementById('edit-password').value.trim(),
                balance: parseFloat(document.getElementById('edit-balance').value) || 0,
                bankName: document.getElementById('edit-bank-name').value.trim(),
                bankAcc: document.getElementById('edit-bank-acc').value.trim(),
                bankHolder: document.getElementById('edit-bank-holder').value.trim()
            };

            update(ref(db, 'users/' + firebaseKey), updatedData);
            closeEditUserModal();
            alert("Đã cập nhật thông tin thành viên thành công trên Firebase!");
        }

        window.openUserHistoryModal = function(firebaseKey) {
            const user = realTimeUsers.find(u => u.firebaseKey === firebaseKey);
            if (!user) return;

            document.getElementById('history-modal-title').innerText = `Lịch sử: ${user.fullname || user.username}`;
            const contentContainer = document.getElementById('user-history-content');
            contentContainer.innerHTML = "";

            let html = `<p class="font-bold text-emerald-400">Lịch sử nạp tiền:</p>`;
            const userDeposits = realTimeDeposits.filter(d => d.username === user.username);
            if (userDeposits.length === 0) {
                html += `<p class="text-gray-500 mb-2">Chưa có giao dịch nạp.</p>`;
            } else {
                userDeposits.forEach(d => {
                    html += `<div class="bg-gray-900 p-2 rounded-xl mb-1 flex justify-between"><span>${d.time}</span><span class="text-emerald-400">+${d.usd.toFixed(2)}U (${d.status})</span></div>`;
                });
            }

            html += `<p class="font-bold text-rose-400 mt-3">Lịch sử rút tiền:</p>`;
            const userWithdraws = realTimeWithdraws.filter(w => w.username === user.username);
            if (userWithdraws.length === 0) {
                html += `<p class="text-gray-500">Chưa có giao dịch rút.</p>`;
            } else {
                userWithdraws.forEach(w => {
                    html += `<div class="p-2 bg-gray-900 rounded-xl mb-1 flex justify-between"><span>${w.time}</span><span class="text-rose-400">-${w.amount.toFixed(2)}U (${w.status})</span></div>`;
                });
            }

            contentContainer.innerHTML = html;
            document.getElementById('user-history-modal').classList.remove('hidden');
            document.getElementById('user-history-modal').classList.add('flex');
        }

        window.closeUserHistoryModal = function() {
            document.getElementById('user-history-modal').classList.add('hidden');
            document.getElementById('user-history-modal').classList.remove('flex');
        }

        document.addEventListener("DOMContentLoaded", () => {
            checkAdminAuth();
        });
    </script>
</body>
</html>
