<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIN USDBOX - Admin Pro Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-[#0b0f19] text-white font-sans min-h-screen pb-12">
    <!-- Màn hình đăng nhập -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-gray-800/90 backdrop-blur p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-700">
            <h2 class="text-2xl font-bold text-white text-center mb-6">Quản Trị Hệ Thống</h2>
            <div class="space-y-4">
                <input type="text" id="username" class="w-full px-4 py-3 bg-gray-900 rounded-xl border border-gray-700 text-white" value="admin">
                <input type="password" id="password" class="w-full px-4 py-3 bg-gray-900 rounded-xl border border-gray-700 text-white" value="admin123">
                <button onclick="handleLogin()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-bold">Đăng Nhập</button>
            </div>
        </div>
    </div>

    <!-- Bảng điều khiển Admin -->
    <div id="admin-panel" class="hidden max-w-7xl mx-auto p-4 md:p-6 space-y-6">
        <header class="flex justify-between items-center bg-gray-800/60 p-5 rounded-2xl border border-gray-700">
            <h1 class="text-2xl font-bold text-emerald-400">Admin Dashboard Realtime</h1>
            <button onclick="handleLogout()" class="bg-red-600/20 text-red-400 px-4 py-2 rounded-xl text-sm font-semibold">Đăng Xuất</button>
        </header>

        <!-- Nạp Tiền Chờ Duyệt -->
        <div class="bg-gray-800/60 rounded-2xl border border-gray-700 p-5">
            <h3 class="text-lg font-bold mb-4 text-emerald-400">Nạp Tiền Chờ Duyệt</h3>
            <table class="w-full text-left text-sm">
                <thead>
                    <tr class="border-b border-gray-700 text-gray-400">
                        <th class="py-3 px-4">Thành Viên</th>
                        <th class="py-3 px-4">Số Tiền</th>
                        <th class="py-3 px-4">Nội Dung</th>
                        <th class="py-3 px-4">Thao Tác</th>
                    </tr>
                </thead>
                <tbody id="table-nap-pending">
                    <tr><td colspan="4" class="py-4 text-center text-gray-500">Đang tải dữ liệu...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Rút Tiền Chờ Duyệt -->
        <div class="bg-gray-800/60 rounded-2xl border border-gray-700 p-5">
            <h3 class="text-lg font-bold mb-4 text-rose-400">Rút Tiền Chờ Duyệt</h3>
            <table class="w-full text-left text-sm">
                <thead>
                    <tr class="border-b border-gray-700 text-gray-400">
                        <th class="py-3 px-4">Thành Viên</th>
                        <th class="py-3 px-4">Số Tiền</th>
                        <th class="py-3 px-4">Ngân Hàng</th>
                        <th class="py-3 px-4">Thao Tác</th>
                    </tr>
                </thead>
                <tbody id="table-rut-pending">
                    <tr><td colspan="4" class="py-4 text-center text-gray-500">Đang tải dữ liệu...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC832BgFHW5LIavbuwE17dp...",
            authDomain: "winusdbox.firebaseapp.com",
            databaseURL: "https://winusdbox-default-rtdb.firebaseio.com",
            projectId: "winusdbox",
            storageBucket: "winusdbox.appspot.com",
            messagingSenderId: "665540389423",
            appId: "1:665540389423:web:7249d5d07b..."
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function handleLogin() {
            if(document.getElementById('username').value === 'admin' && document.getElementById('password').value === 'admin123') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                initRealtime();
            } else { alert('Sai tài khoản!'); }
        }
        function handleLogout() { location.reload(); }

        function initRealtime() {
            // Nạp tiền
            db.ref('transactions/nap_pending').on('value', snap => {
                let tbody = document.getElementById('table-nap-pending');
                tbody.innerHTML = '';
                let data = snap.val();
                if(data) {
                    Object.keys(data).forEach(key => {
                        let item = data[key];
                        tbody.innerHTML += `<tr>
                            <td class="py-3 px-4">${item.username}</td>
                            <td class="py-3 px-4 text-emerald-400">+${item.amount.toLocaleString()} đ</td>
                            <td class="py-3 px-4">${item.content}</td>
                            <td class="py-3 px-4 space-x-2">
                                <button onclick="approveNap('${key}', '${item.username}', ${item.amount}, true)" class="bg-emerald-600 px-3 py-1 rounded text-xs">Duyệt</button>
                                <button onclick="approveNap('${key}', '${item.username}', 0, false)" class="bg-red-600 px-3 py-1 rounded text-xs">Hủy</button>
                            </td>
                        </tr>`;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="4" class="py-4 text-center text-gray-500">Không có đơn nạp chờ duyệt</td></tr>';
                }
            });

            // Rút tiền
            db.ref('transactions/rut_pending').on('value', snap => {
                let tbody = document.getElementById('table-rut-pending');
                tbody.innerHTML = '';
                let data = snap.val();
                if(data) {
                    Object.keys(data).forEach(key => {
                        let item = data[key];
                        tbody.innerHTML += `<tr>
                            <td class="py-3 px-4">${item.username}</td>
                            <td class="py-3 px-4 text-rose-400">-${item.amount.toLocaleString()} đ</td>
                            <td class="py-3 px-4">${item.bankInfo}</td>
                            <td class="py-3 px-4 space-x-2">
                                <button onclick="approveRut('${key}', true)" class="bg-emerald-600 px-3 py-1 rounded text-xs">Duyệt</button>
                                <button onclick="approveRut('${key}', false)" class="bg-red-600 px-3 py-1 rounded text-xs">Hủy</button>
                            </td>
                        </tr>`;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="4" class="py-4 text-center text-gray-500">Không có đơn rút chờ duyệt</td></tr>';
                }
            });
        }

        function approveNap(key, username, amount, isSuccess) {
            db.ref(`transactions/nap_pending/${key}`).remove();
            if(isSuccess) {
                alert('CHÚC MỪNG BẠN ĐÃ NẠP TIỀN THÀNH CÔNG');
                // Cộng tiền vào số dư user nếu cần thiết qua Firebase
            }
        }

        function approveRut(key, isSuccess) {
            db.ref(`transactions/rut_pending/${key}`).remove();
            if(isSuccess) {
                alert('ĐƠN RÚT TIỀN CỦA BẠN ĐÃ ĐƯỢC DUYỆT');
            }
        }
    </script>
</body>
</html>
